[project]
name = "aitoday-backend"
version = "0.1.0"
description = "Backend for AIToday AI news aggregator"
authors = [
    {name = "AIToday Team", email = "team@aitoday.com"},
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "apscheduler>=3.10.4",
    "openai>=1.10.0",
    "feedparser>=6.0.10",
    "praw>=7.7.1",
    "google-api-python-client>=2.116.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "pyyaml>=6.0.1",
    "tweepy>=4.14.0",
    "pgvector>=0.2.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
